<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Pages</title>
<style>
:root{--bg:#121212;--card:#1e1e1e;--text:#f0f0ee;--mut:#a5a5a0;--ln:#333331}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,sans-serif}
main{width:min(560px,100%);display:grid;gap:14px}
h1{margin:0;font-size:20px;font-weight:650;text-align:center}
a{display:block;padding:20px 24px;border:1.5px solid var(--ln);border-radius:16px;background:var(--card);color:var(--text);text-decoration:none;font-weight:600}
a:hover{border-color:var(--mut)}
span{display:block;color:var(--mut);font-size:14px;font-weight:400}
</style>
<body>
<main>
<h1>Pages</h1>
<a href="chatbots/">Chatbot launcher<span>AI chat services, sorted by intelligence index</span></a>
<a href="cost-calculator/">LLM cost calculator<span>Agent token and cost simulator</span></a>
</main>
</body>
</html>
